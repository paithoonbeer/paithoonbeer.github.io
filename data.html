<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="bp-data" content="2.0">
<title>SetSod Data Studio</title>
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:NotoThai;src:url(fonts/noto-sans-thai-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:JetMono;src:url(fonts/jetbrains-mono-latin-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{
  --bg:#0b0d10;--panel:#12161c;--line:#2a323c;--tx:#e8edf1;--mut:#85909b;
  --acc:#3dba8a;--acc2:#2a8f68;--play:#ff6b3d;--r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 NotoThai,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:30px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:#1a2027;cursor:pointer}
.btn:hover{border-color:#3d4a55}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:linear-gradient(180deg,var(--acc),var(--acc2));border-color:#1f6b4d;color:#04140e;font-weight:650}
.btn.on{background:#243040;border-color:#4a6078}
.btn.icon{min-width:34px}
.tb{min-height:22px;min-width:26px;padding:0 6px;font-size:11px;border:1px solid var(--line);border-radius:5px;background:#182028;cursor:pointer}
.tb.on{background:#3a2a2a;color:#f88}
.shell{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#171c22,#10141a);border-bottom:1px solid var(--line)}
.brand{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.spacer{flex:1}
.clock{font-family:JetMono,ui-monospace,monospace;font-size:18px;min-width:7ch}
.gate{display:none;margin:0;padding:8px 12px;background:#1a1510;color:#e8d2b0;border-bottom:1px solid #5a4030}
.gate.on{display:block}
.import{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.import .drop{flex:1;min-width:200px;border:1px dashed #3a4650;border-radius:8px;padding:8px 12px;text-align:center;cursor:pointer}
.import .drop.over{border-color:var(--acc);background:rgba(61,186,138,.08)}
.status{color:var(--mut);font-family:JetMono,ui-monospace,monospace;font-size:11px}
.main{display:grid;grid-template-columns:160px 1fr;grid-template-rows:28px 1fr minmax(160px,28vh);min-height:0}
.corner{background:#0a0c0f;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ruler-wrap{overflow:hidden;background:#0a0c0f;border-bottom:1px solid var(--line)}
#ruler{display:block;height:28px}
.heads{overflow:auto;border-right:1px solid var(--line);background:#101419}
.thead{height:72px;padding:6px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:4px}
.thead.on{background:#18222c}
.tn{display:flex;align-items:center;gap:6px}
.tn i{width:8px;height:8px;border-radius:50%}
.tn input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;padding:0}
.tn input:focus{border-bottom-color:#3d4a55;outline:0}
.tn b{font-size:9px;color:var(--mut);font-family:JetMono,monospace}
.tops{display:flex;gap:3px}
.lanes-wrap{overflow:auto;position:relative;background:#0d1116;cursor:crosshair;grid-row:2;grid-column:2}
.lanes{position:relative;min-height:100%}
.lane{height:72px;border-bottom:1px solid #1a222b;position:relative}
.lane.on{background:rgba(61,186,138,.03)}
.clip{position:absolute;top:8px;height:56px;border:1px solid;border-radius:4px;overflow:hidden;cursor:grab}
.clip.sel{outline:1px solid #fff8}
.cw{display:block;pointer-events:none}
.clab{position:absolute;left:6px;top:2px;font-size:10px;text-shadow:0 1px 2px #000;pointer-events:none}
.hndl{position:absolute;top:0;bottom:0;width:6px;background:transparent;cursor:ew-resize}
.hndl.L{left:0}.hndl.R{right:0}
.mblock{position:absolute;height:8px;border-radius:2px;opacity:.85}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--play);z-index:5;pointer-events:none;box-shadow:0 0 8px rgba(255,107,61,.5)}
.mixer{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);background:#101419}
.strip{flex:0 0 110px;background:#151a21;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px}
.strip .lab{font-size:11px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .fx{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mut)}
.strip .fx input{flex:1;accent-color:var(--acc)}
.strip .fader{width:100%;accent-color:var(--acc)}
.ms{display:flex;gap:4px;justify-content:center}
.piano{display:none;grid-template-columns:56px 1fr;height:180px;border-top:1px solid var(--line);background:#0c0f14}
.piano.on{display:grid}
#pianoKeys{overflow:hidden;background:#151a20;border-right:1px solid var(--line)}
.pkey{font-size:9px;padding-left:4px;border-bottom:1px solid #222;display:flex;align-items:center;color:#789}
.pkey.blk{background:#0a0c10;color:#567}
#pianoScroll{overflow:auto;position:relative}
#pianoGrid{position:relative}
.pnote{position:absolute;background:var(--acc);border-radius:2px;opacity:.9;cursor:pointer}
.pnote.sel{outline:1px solid #fff}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:#12161b}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2430;border:1px solid #3a4650;padding:8px 14px;border-radius:8px;z-index:20;display:none}
.toast.on{display:block}
label.chk{display:inline-flex;gap:5px;align-items:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="gate" id="gate">สตูดิโอนี้ใช้ได้บนคอมพิวเตอร์เท่านั้น — มือถือใช้แอป SetSod สำหรับเล่นสด</div>
<div class="shell" id="app">
  <header class="top">
    <div class="brand">SetSod Data <small>สตูดิโอแต่งเพลง · ตัดต่อ · MIDI · อัดเสียง</small></div>
    <button type="button" class="btn icon" id="btnPlay" title="Space">▶</button>
    <button type="button" class="btn icon" id="btnStop">■</button>
    <button type="button" class="btn icon" id="btnRec" title="อัดเสียง" style="color:#f66">●</button>
    <div class="clock" id="clock">0:00.0</div>
    <label>BPM <input id="bpm" type="number" min="40" max="240" value="120" style="width:56px;background:#0c0f14;border:1px solid var(--line);border-radius:6px;padding:4px"></label>
    <label class="chk"><input type="checkbox" id="chkMetro"> เมโทรนอม</label>
    <label class="chk"><input type="checkbox" id="chkLoop"> ลูป</label>
    <label class="chk"><input type="checkbox" id="chkSnap" checked> สแนป</label>
    <label>ซูม <input id="zoom" type="range" min="40" max="200" value="80"></label>
    <div class="spacer"></div>
    <button type="button" class="btn" id="btnSelect">เลือก</button>
    <button type="button" class="btn" id="btnSplit">ตัด (S)</button>
    <button type="button" class="btn" id="btnDraw">วาดโน้ต</button>
    <button type="button" class="btn" id="btnUndo">↶</button>
    <button type="button" class="btn" id="btnRedo">↷</button>
    <button type="button" class="btn" id="btnDel">ลบ</button>
    <a class="btn" href="./">SetSod</a>
  </header>

  <div class="import">
    <div class="drop" id="dropAi"><b>ลากเพลงมาวาง = แยก AI เป็นแทร็ก</b> · หรือ
      <label class="btn" style="margin-left:6px">เลือกไฟล์<input id="fAi" type="file" accept="audio/*" hidden></label>
      <button class="btn pri" id="goAi" disabled>แยกด้วย AI</button>
    </div>
    <label class="btn">นำเข้าเสียงเข้าแทร็ก<input id="fAud" type="file" accept="audio/*" hidden></label>
    <button class="btn" id="btnAddAud">+ แทร็กเสียง</button>
    <button class="btn" id="btnAddMidi">+ แทร็ก MIDI</button>
    <button class="btn" id="btnNew">โปรเจกต์ใหม่</button>
    <button class="btn" id="btnSave">บันทึก</button>
    <button class="btn" id="btnLoad">เปิดโปรเจกต์</button>
    <input id="fileProj" type="file" accept=".json,application/json" hidden>
    <span class="status" id="sAi"></span>
  </div>

  <div class="main">
    <div class="corner"></div>
    <div class="ruler-wrap"><canvas id="ruler" height="28"></canvas></div>
    <div class="heads" id="trackHeads"></div>
    <div class="lanes-wrap" id="lanesWrap">
      <div class="lanes" id="lanes"></div>
      <div class="playhead" id="playhead"></div>
    </div>
    <div class="mixer" id="mixer"></div>
  </div>

  <div class="piano" id="pianoRoll">
    <div id="pianoKeys"></div>
    <div id="pianoScroll"><div id="pianoGrid"></div></div>
  </div>

  <footer class="foot">
    <button type="button" class="btn pri" id="btnMixdown">↓ มิกซ์ดาวน์ WAV</button>
    <button type="button" class="btn" id="sendSs">ส่งแทร็กเสียงเข้า SetSod</button>
    <span class="status" id="sOut">Space = เล่น/หยุด · S = ตัดคลิป · D = วาดโน้ต MIDI · ดับเบิลคลิกแทร็ก = นำเข้าเสียง</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import {createStudio} from './data-studio.js';

const desk=matchMedia('(pointer:fine)').matches&&!/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)&&innerWidth>=900;
if(!desk)document.getElementById('gate').classList.add('on');
let gpuF16=false;
(async()=>{try{const p=navigator.gpu?.requestAdapter?.();if(!p)return;const a=await Promise.race([p,new Promise(r=>setTimeout(()=>r(null),2000))]);gpuF16=!!(a&&a.features?.has('shader-f16'))}catch(e){}})();

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),2500)}

const studio=createStudio({
  root:document.getElementById('app'),
  toast,
  onTransport(st){
    const t=st.playing?st.ac.currentTime-st.t0+st.offset:st.offset;
    document.getElementById('clock').textContent=studio.fmt(t);
    document.getElementById('btnPlay').textContent=st.playing?'❚❚':'▶';
    document.getElementById('btnRec').classList.toggle('on',!!st.recording);
    document.getElementById('pianoRoll').classList.toggle('on',!!(st.tracks[st.sel.track]?.type==='midi'));
  },
  onProject(st){document.getElementById('sOut').textContent=`${st.title} · ${st.tracks.length} แทร็ก · BPM ${st.bpm}${st.dirty?' · ยังไม่บันทึก':''}`}
});
await studio.boot();
window.__ssd=studio;

/* AI split → load as tracks */
const $=id=>document.getElementById(id);
let aiFile=null,aiBusy=false;
const AUD=/\.(mp3|wav|m4a|aac|flac|ogg)$/i;
['dragenter','dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{try{if([...e.dataTransfer.types||[]].includes('Files'))e.preventDefault()}catch(_){}}));
function bindDrop(el,fn){let n=0;
  el.addEventListener('dragenter',e=>{e.preventDefault();n++;el.classList.add('over')});
  el.addEventListener('dragover',e=>e.preventDefault());
  el.addEventListener('dragleave',()=>{if(--n<=0){n=0;el.classList.remove('over')}});
  el.addEventListener('drop',e=>{e.preventDefault();n=0;el.classList.remove('over');fn(e.dataTransfer.files)});
}
function setAi(f){
  if(!f||!(AUD.test(f.name)||/^audio\//.test(f.type||''))){$('sAi').textContent='❌ เลือกไฟล์เสียง';return}
  aiFile=f;$('goAi').disabled=false;$('sAi').textContent='✅ '+f.name+' — กดแยก หรือรอเริ่มอัตโนมัติ';startAi();
}
$('fAi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)setAi(f)};
bindDrop($('dropAi'),fs=>setAi(fs[0]));
$('dropAi').addEventListener('click',e=>{if(e.target.closest('button,label,input'))return;$('fAi').click()});

async function startAi(){
  if(!aiFile||aiBusy||!desk){if(!desk)$('sAi').textContent='❌ ใช้พีซีเท่านั้น';return}
  aiBusy=true;$('goAi').disabled=true;$('sAi').textContent='⏳ ถอดรหัส…';
  try{
    const ac=new OfflineAudioContext(2,1,44100);
    const buf=await ac.decodeAudioData(await aiFile.arrayBuffer());
    const L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L.slice();
    const title=aiFile.name.replace(/\.[^.]+$/,'');
    const w=new Worker('stems-ai-worker.js');
    const d=await new Promise((ok,no)=>{
      w.onmessage=({data:m})=>{
        if(m.t==='dl')$('sAi').textContent=`⏳ โหลดโมเดล ${(m.p*100|0)}%`;
        else if(m.t==='ready')$('sAi').textContent='⏳ กำลังแยก…';
        else if(m.t==='prog')$('sAi').textContent=`⏳ แยก ${(m.p*100|0)}%`;
        else if(m.t==='err'){w.terminate();no(new Error(m.m))}
        else if(m.t==='done'){w.terminate();ok(m)}
      };
      w.onerror=e=>{w.terminate();no(e.error||e)};
      w.postMessage({opt:{wasmOnly:!gpuF16,eps:gpuF16?['webgpu']:['wasm']},L,R});
    });
    $('sAi').textContent='✅ แยกเสร็จ — โหลดเข้าสตูดิโอแล้ว';
    studio.state.title=title;
    studio.loadStemChannels({title,src:d.src,channels:d.src.map((_,k)=>({L:d.out[k][0],R:d.out[k][1]})),sampleRate:44100});
    toast('ได้แทร็ก stems + MIDI พร้อมแต่ง');
  }catch(e){$('sAi').textContent='❌ '+(e.message||e)}
  finally{aiBusy=false;$('goAi').disabled=!aiFile}
}
$('goAi').onclick=startAi;

$('fAud').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const i=studio.state.sel.track;
  await studio.importAudioToTrack(i,f,studio.state.offset);
  toast('นำเข้าเสียงแล้ว');
};

$('sendSs').onclick=async()=>{
  toast('กำลังเรนเดอร์แทร็ก…');
  const out=[];
  for(const tr of studio.state.tracks){
    if(tr.type!=='audio'||!tr.clips.length)continue;
    const len=Math.ceil(studio.getDur()*44100);
    const off=new OfflineAudioContext(2,Math.max(len,44100),44100);
    for(const c of tr.clips){
      const buf=studio.state.buffers.get(c.buf);if(!buf)continue;
      const s=off.createBufferSource();s.buffer=buf;s.connect(off.destination);s.start(c.start,c.offset,c.dur);
    }
    const rendered=await off.startRendering();
    const n=rendered.length,b=new DataView(new ArrayBuffer(44+n*4));
    const w=(o,s)=>[...s].forEach((ch,i)=>b.setUint8(o+i,ch.charCodeAt(0)));
    w(0,'RIFF');b.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,2,true);
    b.setUint32(24,44100,true);b.setUint32(28,176400,true);b.setUint16(32,4,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*4,true);
    const L=rendered.getChannelData(0),R=rendered.numberOfChannels>1?rendered.getChannelData(1):L;
    for(let i=0,o=44;i<n;i++,o+=4){b.setInt16(o,Math.max(-1,Math.min(1,L[i]))*32767,true);b.setInt16(o+2,Math.max(-1,Math.min(1,R[i]))*32767,true)}
    out.push(new File([b],`${studio.state.title||'track'} (${tr.name}).wav`,{type:'audio/wav'}));
  }
  if(out.length<2){toast('ต้องมีแทร็กเสียงอย่างน้อย 2 แทร็ก');return}
  const bc=new BroadcastChannel('bp-stems');let ok=false;
  bc.onmessage=e=>{if(e.data?.t==='ack'){ok=true;toast('ส่งเข้า SetSod แล้ว')}};
  bc.postMessage({t:'stems',title:studio.state.title,files:out});
  setTimeout(()=>{if(!ok)toast('เปิดแท็บ SetSod ไว้ แล้วกดส่งอีกครั้ง — หรือใช้มิกซ์ดาวน์')},1500);
};
</script>
</body>
</html>
